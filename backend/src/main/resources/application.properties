server.port=${PORT:8080}
server.address=0.0.0.0

spring.application.name=backend
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Request & Multipart Payload Limits
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Secret (In production this would be an env variable)
jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b2a7585f67b557fb40b3ec56a5dc8172df}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google Drive API OAuth 2.0 Credentials
google.drive.client.id=${GOOGLE_DRIVE_CLIENT_ID:}
google.drive.client.secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
google.drive.refresh.token=${GOOGLE_DRIVE_REFRESH_TOKEN:}
google.drive.folder.id=${GOOGLE_DRIVE_FOLDER_ID:}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

